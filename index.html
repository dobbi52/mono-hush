<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>MONO HUSH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Do+Hyeon&display=swap">
<style>
/* 한 화면 게임: 전체를 덮는 픽셀 캔버스 + 가장자리 HUD + 가운데 오버레이 */
:root{
  --ink:#050505; --bone:#ecebe6; --ash:#8a8984; --line:#3a3a37;
  --display:'Silkscreen',ui-monospace,monospace;
  --ui:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--bone);font-family:var(--ui);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#game{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--ink);display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--ash)}
.hud b{color:var(--bone);font-weight:400;font-variant-numeric:tabular-nums}
#hint{position:fixed;left:0;right:0;text-align:center;top:calc(env(safe-area-inset-top,0px) + 40px);font-size:16px;color:var(--ash);pointer-events:none;transition:opacity .8s;padding:0 16px}
.btns{position:fixed;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;grid-template-columns:auto auto;grid-template-areas:'. b' 't j';gap:12px;align-items:end;justify-items:end}
#throwBtn{grid-area:t}#breathBtn{grid-area:b}#jumpBtn{grid-area:j}
.btn.big{width:92px;height:92px;font-size:20px}
#keyHint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:14px;color:var(--ash);pointer-events:none;padding:0 16px;display:none}
#keyHint b{color:var(--bone);font-weight:400;font-family:var(--display);font-size:11px;border:1px solid var(--line);padding:1px 5px;margin-right:4px}
body.pc .btns,body.pc #joy{display:none!important}body.pc #keyHint{display:block}body.pc #game{cursor:crosshair}
.btn.sm{width:62px;height:62px;font-size:16px}
#breathBtn{background:conic-gradient(rgba(236,235,230,.32) calc(var(--b,1)*360deg),rgba(5,5,5,.6) 0)}
#breathBtn.held{background:var(--bone);color:var(--ink)}#breathBtn.held small{color:var(--ink)}
.btn{appearance:none;border:2px solid var(--bone);background:rgba(5,5,5,.6);color:var(--bone);font-family:var(--ui);font-size:18px;
  width:78px;height:78px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px;line-height:1.1;cursor:pointer}
.btn small{display:block;font-family:var(--display);font-size:10px;color:var(--ash)}
.btn:active{background:var(--bone);color:var(--ink)}
.btn:focus-visible{outline:2px dashed var(--bone);outline-offset:4px}
.btn[disabled]{opacity:.35}
#joy{position:fixed;width:100px;height:100px;margin:-50px 0 0 -50px;border:2px solid rgba(236,235,230,.3);border-radius:50%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;background:rgba(236,235,230,.65);border-radius:50%}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,5,5,.86);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{max-width:340px;width:100%;display:flex;flex-direction:column;gap:18px;text-align:center}
.panel h1{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:.06em;line-height:1;margin:0}
.panel h2{font-size:34px;font-weight:400;margin:0}
.panel p{margin:0;font-size:17px;color:var(--ash);line-height:1.5;text-wrap:balance}
.rules{list-style:none;padding:14px 0;margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:16px;text-align:left}
.rules span{display:inline-block;width:64px;color:var(--ash)}
.go{appearance:none;border:2px solid var(--bone);background:var(--bone);color:var(--ink);font-family:var(--ui);font-size:22px;padding:14px 0;cursor:pointer}
.go:focus-visible{outline:2px dashed var(--bone);outline-offset:4px}
.go.alt{background:transparent;color:var(--bone);font-size:18px;padding:11px 0}
.screen.fadein{animation:fadein .7s ease both}@keyframes fadein{from{opacity:0}}
#overTitle.glitch{animation:glitch 1s steps(1,end) both}
@keyframes glitch{0%{opacity:0}10%{opacity:1;transform:translate(-7px,0) skewX(18deg);text-shadow:5px 0 var(--ash),-5px 0 var(--line);clip-path:inset(10% 0 45% 0)}
 25%{transform:translate(6px,0);clip-path:inset(55% 0 8% 0)}40%{transform:translate(-3px,0) skewX(-10deg);clip-path:inset(0 0 65% 0)}
 55%{transform:translate(2px,0);clip-path:inset(30% 0 30% 0)}70%{transform:none;clip-path:inset(0);text-shadow:2px 0 var(--ash),-2px 0 var(--line)}100%{text-shadow:none}}
#overTitle.calm{animation:rise 1.4s ease both}@keyframes rise{from{opacity:0;letter-spacing:.5em}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#overTitle.glitch,#overTitle.calm,.screen.fadein{animation:none}}
.how{text-align:left;font-size:16px}.how summary{cursor:pointer;color:var(--ash);padding:4px 0}.how .rules{margin-top:10px}
.cine .hud,.cine .btns,.cine #hint,.cine #joy,.cine #keyHint{display:none!important}
.intro .skip.wait{top:44%;bottom:auto;font-size:21px;color:var(--bone);line-height:1.6;animation:pulse 1.8s ease-in-out infinite}
.intro .skip.wait small{display:block;font-size:14px;color:var(--ash)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.intro .skip.wait{animation:none}}
#wipe{position:fixed;inset:0;background:var(--ink);z-index:50}
#wipeRing{position:fixed;border:2px solid var(--bone);border-radius:50%;z-index:51;pointer-events:none;box-shadow:0 0 0 6px rgba(236,235,230,.12)}
.menu{background:transparent;display:block;padding:0;overflow:hidden}
.mtop{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;will-change:transform,opacity;
  padding-top:calc(env(safe-area-inset-top,0px) + 12vh);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mhead{display:flex;flex-direction:column;gap:16px;align-items:center}
.mhead h1{font-family:var(--display);font-weight:400;font-size:52px;letter-spacing:.08em;line-height:1;margin:0;text-shadow:0 0 18px rgba(5,5,5,.9)}
.mhead p{margin:0;font-size:17px;color:var(--ash);line-height:1.5;text-shadow:0 0 10px var(--ink)}
.mfoot{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.mfoot .go.alt{background:rgba(5,5,5,.55)}
.mmap{position:absolute;inset:0;pointer-events:none}
.mmap.on{pointer-events:auto}
.mbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.back{appearance:none;background:none;border:0;color:var(--bone);font-family:var(--ui);font-size:17px;padding:8px 6px;cursor:pointer}
.back:focus-visible{outline:2px dashed var(--bone)}
.room{position:absolute;appearance:none;background:none;border:0;padding:0;color:var(--bone);font-family:var(--ui);cursor:pointer;
  display:flex;align-items:center;gap:10px;transform:translate(0,-50%);text-align:left;white-space:nowrap}
.room.r{flex-direction:row-reverse;transform:translate(-100%,-50%);text-align:right}
.room b{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;font-family:var(--display);font-weight:400;font-size:18px;
  color:var(--bone);border:2px solid var(--bone);background:rgba(5,5,5,.35)}
.room span{display:flex;flex-direction:column;gap:2px;font-size:18px;text-shadow:0 0 8px var(--ink),0 0 2px var(--ink)}
.room em{font-style:normal;font-size:13px;color:var(--ash)}
.room.now b{background:var(--bone);color:var(--ink)}
.room.now em{color:var(--bone)}
.room[disabled]{cursor:default;color:var(--line)}.room[disabled] b{border-color:var(--line);color:var(--line);background:transparent}.room[disabled] em{color:var(--line)}
.room:not([disabled]):hover b{box-shadow:0 0 0 5px rgba(236,235,230,.15)}
.room:focus-visible{outline:2px dashed var(--bone);outline-offset:4px}
.menu2{display:flex;gap:10px}.menu2 .go{flex:1}
.acc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:34px;font-size:13px;color:var(--bone);background:rgba(5,5,5,.55);padding:4px 8px}
.acc[hidden]{display:none}.acc span{min-width:0;overflow-wrap:anywhere}.acc em{font-style:normal;display:block;opacity:.75}
.acc button{appearance:none;flex:none;height:32px;padding:0 10px;border:1px solid var(--bone);background:transparent;color:var(--bone);font-family:var(--ui);font-size:13px;cursor:pointer}
.intro{background:transparent;display:block;cursor:pointer}
.intro .cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22%);text-align:center;font-size:22px;color:var(--bone);margin:0;padding:0 24px;min-height:1.5em;letter-spacing:.02em}
.intro .ititle{position:absolute;left:0;right:0;top:calc(46% - 48px);text-align:center;font-family:var(--display);font-weight:400;font-size:48px;line-height:1;letter-spacing:.06em;margin:0;opacity:0;transition:opacity 1.1s ease,letter-spacing 2.6s ease}
.intro .ititle.on{opacity:1;letter-spacing:.14em}
.intro .skip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;font-size:14px;color:var(--ash)}
.tutp{gap:14px}
.tutp h2{font-size:26px}
.tutcv{width:100%;max-width:100%;aspect-ratio:160/96;image-rendering:pixelated;border:1px solid var(--line);background:#0d0d0c;display:block}
.tools{display:flex;flex-direction:column;gap:12px;text-align:left}
.tool{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;font-size:15px;color:var(--ash);line-height:1.45}
.tool i{font-style:normal;font-size:13px !important;width:58px;height:58px;border:2px solid var(--bone);border-radius:50%;display:grid;place-items:center;color:var(--bone);font-size:15px}
.tool b{display:block;font-weight:400;color:var(--bone);font-size:17px}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:7px;height:7px;background:var(--line)}.dots i.on{background:var(--bone)}
.stamp{font-family:var(--display);font-size:12px;color:var(--ash);letter-spacing:.1em}
</style>
</head>
<body>

<canvas id="game" aria-label="게임 화면"></canvas>
<div class="hud"><span>STONE <b id="stones">3</b></span><span>KEY <b id="keys">0/3</b></span><span><b id="time">0:00.0</b></span></div>
<div id="hint"></div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="keyHint"><b>WASD</b>이동 &nbsp; <b>SHIFT</b>살금살금 &nbsp; <b>SPACE</b>점프 &nbsp; <b>CLICK</b>돌 던지기 &nbsp; <b>Q</b>숨 참기</div>
<div class="btns">
  <button class="btn sm" id="breathBtn" type="button">숨<small>참기</small></button>
  <button class="btn" id="throwBtn" type="button">던지기<small id="throwN">x3</small></button>
  <button class="btn big" id="jumpBtn" type="button">점프</button>
</div>

<div class="screen menu" id="start">
  <div class="mtop" id="mTop">
    <div class="mhead">
      <div class="stamp">FIVE DROWNED ROOMS</div>
      <h1>MONO<br>HUSH</h1>
      <p>물을 밟으면 소리가 난다.<br>그것은 눈이 없고, 소리만 듣는다.</p>
    </div>
    <div class="mfoot">
      <button class="go" id="enterBtn" type="button">들어가기</button>
      <div class="menu2"><button class="go alt" id="howBtn" type="button">게임 설명</button><button class="go alt" id="replayBtn" type="button">인트로 보기</button></div>
      <div class="acc" id="acc" hidden></div>
    </div>
  </div>
  <div class="mmap" id="mMap" aria-hidden="true">
    <div class="mbar"><button class="back" id="backBtn" type="button">← 처음으로</button><span class="stamp">방 고르기</span></div>
    <div id="rooms"></div>
  </div>
</div>
<div class="screen" id="over" hidden>
  <div class="panel">
    <div class="stamp" id="overStamp">CAUGHT</div>
    <h2 id="overTitle">잡혔다</h2>
    <p id="overText">물소리가 너무 컸어요.</p>
    <button class="go" id="againBtn" type="button">다시 하기</button>
    <button class="go alt" id="sameBtn" type="button">같은 모양 다시</button>
    <button class="go alt" id="menuBtn" type="button">방 고르기</button>
  </div>
</div>

<div class="screen intro" id="introScreen" hidden>
  <p class="cap" id="introCap"></p>
  <h1 class="ititle" id="introTitle">MONO<br>HUSH</h1>
  <div class="skip" id="introSkip">화면을 눌러 시작 · 소리를 켜 주세요</div>
</div>
<div class="screen" id="tut" hidden>
  <div class="panel tutp">
    <div class="stamp" id="tutStep">1 / 4</div>
    <canvas id="tutCanvas" class="tutcv" aria-hidden="true"></canvas>
    <div class="tools" id="tutTools" hidden></div>
    <h2 id="tutTitle"></h2>
    <p id="tutText"></p>
    <div class="dots" id="tutDots"><i></i><i></i><i></i><i></i></div>
    <button class="go" id="tutNext" type="button">다음</button>
    <button class="go alt" id="tutSkip" type="button">건너뛰기</button>
  </div>
</div>

<div id="wipe" hidden></div><div id="wipeRing" hidden></div>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const dark=document.createElement('canvas'),dc=dark.getContext('2d');
let W=320,H=600;
function resize(){const r=innerHeight/Math.max(1,innerWidth);H=Math.round(Math.min(Math.max(W*r,420),720));cv.width=W;cv.height=H;dark.width=W;dark.height=H;ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();

const WH=1600;
const ROOMS=[
 {name:'물에 잠긴 복도',en:'THE DROWNED HALL',mv:2,creak:3,mons:1,flood:false,light:1,stones:3,rule:'기본 규칙을 익혀요'},
 {name:'흔들리는 다리',en:'THE SWAYING BRIDGE',mv:6,creak:7,mons:1,flood:false,light:1,stones:3,rule:'판자가 많이 움직이고 자주 삐걱여요'},
 {name:'둘이 사는 곳',en:'WHERE TWO DWELL',mv:2,creak:3,mons:2,flood:false,light:1,stones:4,rule:'괴물이 둘이에요'},
 {name:'차오르는 물',en:'THE RISING TIDE',mv:2,creak:3,mons:1,flood:true,light:1,stones:3,rule:'물이 차올라 아래쪽 판자부터 잠겨요'},
 {name:'빛 없는 곳',en:'THE LIGHTLESS',mv:2,creak:3,mons:1,flood:false,light:.32,stones:4,rule:'빛이 거의 없어요 · 물결이 퍼질 때만 보여요'}];
let RI=0,ROOM=ROOMS[0],MSTARTS=[];
const CLOUD={host:/(^|\.)github\.io$/.test(location.hostname),ok:false,user:null,ref:null,auth:null,msg:'',state:'',timer:0};
const LSK='mono-hush-unlocked';
function loadUnlocked(){try{return Math.max(1,Math.min(5,parseInt(localStorage.getItem(LSK),10)||1))}catch(e){return 1}}
function saveUnlocked(n){try{localStorage.setItem(LSK,String(n))}catch(e){}cloudPush()}
let PL=[],MV=[],DRIPS=[],EXIT={x:160,y:92},KEYS0=[],ITEMS0=[],MSTART={x:70,y:1090},PSTART={x:160,y:1550},SEED=0;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(seed){
  for(let tries=0;tries<200;tries++){if(tryGen(rng(seed*31+tries)))return}
  function tryGen(R){
    const ri=(a,b)=>a+R()*(b-a),pick=a=>a[Math.floor(R()*a.length)],rd=Math.round;
    const pl=[];
    const close=(a,b,m)=>a.x-m<b.x+b.w&&a.x+a.w+m>b.x&&a.y-m<b.y+b.h&&a.y+a.h+m>b.y;
    const box=o=>o.sw||o;
    const free=(q,m,skip)=>q.x>=8&&q.x+q.w<=W-8&&pl.every(o=>o===skip||!close(q,box(o),m));
    const edge=(a,b)=>Math.hypot(Math.max(0,Math.max(a.x,b.x)-Math.min(a.x+a.w,b.x+b.w)),Math.max(0,Math.max(a.y,b.y)-Math.min(a.y+a.h,b.y+b.h)));
    const ptDist=(x,y,o)=>{const q=box(o);return Math.hypot(Math.max(q.x-x,0,x-q.x-q.w),Math.max(q.y-y,0,y-q.y-q.h))};
    const nearest=(x,y)=>Math.min(...pl.map(o=>ptDist(x,y,o)));
    const sc=ri(70,250),start={x:rd(sc-52),y:1496,w:104,h:80};pl.push(start);
    const ec=ri(80,240),exit={x:rd(ec-56),y:50,w:112,h:96};
    const path=[start];let cur=start;
    while(!(cur.y-(exit.y+exit.h)<=44&&edge(cur,exit)<=40)){
      let ok=null;
      for(let k=0;k<80&&!ok;k++){
        const w=rd(ri(50,92)),h=rd(ri(26,44)),g=ri(24,38),cx=cur.x+cur.w/2+ri(-95,95);
        const q={x:rd(Math.min(W-10-w,Math.max(10,cx-w/2))),y:rd(cur.y-g-h),w,h};
        if(q.y<exit.y+exit.h+36)continue;
        if(q.y<exit.y+exit.h+70&&edge(q,exit)>40)continue;
        if(edge(q,cur)>40||!free(q,12))continue;
        ok=q}
      if(!ok||path.length>40)return false;
      pl.push(ok);path.push(ok);cur=ok}
    pl.push(exit);
    for(let k=0,n=0;k<60&&n<7;k++){const b=pick(path.slice(1)),w=rd(ri(40,80)),h=rd(ri(24,40)),gx=ri(30,110);
      const q=R()<.5?{x:rd(b.x+b.w+gx),y:rd(b.y+ri(-30,30)),w,h}:{x:rd(b.x-gx-w),y:rd(b.y+ri(-30,30)),w,h};
      if(q.y>exit.y+exit.h+20&&q.y+q.h<start.y-20&&free(q,22)){pl.push(q);n++}}
    const mv=[];
    for(const q of [...path.slice(2,-1),...pl.slice(path.length+1)].sort(()=>R()-.5)){if(mv.length>=ROOM.mv)break;
      const amp=rd(ri(36,58)),sw={x:q.x-amp,y:q.y,w:q.w+amp*2,h:q.h};
      if(free(sw,12,q)){q.sw=sw;mv.push({q,x0:q.x,amp,per:ri(5,8),ph:R()})}}
    const keys=[];
    for(const [y0,y1] of [[1160,1420],[680,1080],[220,620]]){let ok=null;
      for(let k=0;k<120&&!ok;k++){const x=ri(14,W-14),y=ri(y0,y1),nd=nearest(x,y);
        if(nd>=24&&nd<=70&&keys.every(o=>Math.hypot(o.x-x,o.y-y)>90))ok={x:rd(x),y:rd(y)}}
      if(!ok)return false;keys.push(ok)}
    const drips=[];
    for(const [y0,y1] of [[1300,1470],[950,1250],[600,900],[200,560]]){
      for(let k=0;k<60;k++){const x=ri(14,W-14),y=ri(y0,y1);
        if(nearest(x,y)>=10&&keys.every(o=>Math.hypot(o.x-x,o.y-y)>40)){drips.push({x:rd(x),y:rd(y),per:ri(4.2,6.4),ph:ri(0,5)});break}}}

function escapeTo(m){const g=grid(),[ci,cj]=cellOf(m.x,m.y);let best=null,bd=1e9;
  for(let r=1;r<14&&!best;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;const ni=ci+di,nj=cj+dj;
    if(ni<0||nj<0||ni>=GW||nj>=GH||g[nj*GW+ni])continue;const x=ni*GC+GC/2,y=nj*GC+GC/2,dd=Math.hypot(x-m.x,y-m.y);if(dd<bd&&!blocked(x,y)){bd=dd;best={x,y}}}
  return best||{x:m.x,y:m.y}}
function waypoint(m,dt){
  if(blocked(m.x,m.y)){m.path=null;return escapeTo(m)}
  const goal=freePoint(m.tx,m.ty);m.gx=goal.x;m.gy=goal.y;
  if(clearLine(m.x,m.y,goal.x,goal.y)){m.path=null;return goal}
  m.pT=(m.pT||0)-dt;const key=Math.round(goal.x/GC)+','+Math.round(goal.y/GC);
  if(!m.path||m.pT<=0||m.pk!==key){m.path=findPath(m.x,m.y,goal.x,goal.y);m.pT=.5;m.pk=key}
  const P=m.path;while(P.length&&Math.hypot(P[0].x-m.x,P[0].y-m.y)<4)P.shift();
  if(!P.length){m.stall=(m.stall||0)+dt;return {x:m.x,y:m.y}}
  for(let k=Math.min(P.length-1,8);k>0;k--)if(clearLine(m.x,m.y,P[k].x,P[k].y)){P.splice(0,k);break}
  return P[0]}
function moveMon(m,w,sp,dt){const wx=w.x-m.x,wy=w.y-m.y,wl=Math.hypot(wx,wy);if(wl<.01)return;const st=Math.min(wl,sp*dt),vx=wx/wl*st,vy=wy/wl*st;
  if(blocked(m.x,m.y)){m.x+=vx;m.y+=vy;m.walk+=st;return}
  if(!blocked(m.x+vx,m.y+vy)){m.x+=vx;m.y+=vy;m.walk+=st}
  else if(!blocked(m.x+vx,m.y)){m.x+=vx;m.walk+=Math.abs(vx)}
  else if(!blocked(m.x,m.y+vy)){m.y+=vy;m.walk+=Math.abs(vy)}
  else m.pT=0}
function stepMonster(m,dt){const p=S.p;
  const pd=Math.hypot(m.x-p.x,m.y-p.y);
  m.bt-=dt;if((m.state==='suspect'||m.state==='listen'||m.state==='ambush')&&m.bt<=0&&pd<420){m.bt=m.state==='ambush'?.95:1.5;breath(.35*(1-pd/420))}
  m.timer-=dt;m.ev=Math.max(0,(m.ev||0)-dt*.25);
  if(m.state==='wander'&&m.timer<=0){const near=!S.p.hidden&&Math.random()<(m.i?.4:.65);for(let k=0;k<16;k++){const cx=near?p.x:m.x,cy=near?p.y+(Math.random()*2-1)*40:m.y,r=near?110:100;const tx=cx+(Math.random()*2-1)*r,ty=cy+(Math.random()*2-1)*r;if(!blocked(tx,ty)){m.tx=tx;m.ty=ty;break}}m.timer=2.5+Math.random()*2}
  const sp=m.state==='hunt'?60:m.state==='suspect'?42:m.state==='ambush'?42:m.state==='listen'?0:(pd>300?32:20);
  const dx=m.tx-m.x,dy=m.ty-m.y,dl=Math.hypot(dx,dy);
  m.stall=0;if(dl>4&&sp>0)moveMon(m,waypoint(m,dt),sp,dt);
  const gd=m.gx!==undefined?Math.hypot(m.gx-m.x,m.gy-m.y):dl;
  if((m.state==='hunt'||m.state==='suspect')&&(dl<=6||gd<=6||m.stall>0||m.timer<=0)){
    if(m.after){const a=m.after;m.after=null;m.state='suspect';m.tx=a.x;m.ty=a.y;m.timer=5}
    else{const lh=m.lastHeard,pt=m.src&&lh&&S.t-lh.t<8?ambushPoint(lh):null;if(pt){m.state='ambush';m.tx=pt.x;m.ty=pt.y;m.timer=5.5;m.src=false}else{m.state='listen';m.timer=1.6}}}
  else if(m.state==='ambush'&&m.timer<=0){m.state='wander';m.timer=0}
  else if(m.state==='listen'&&m.timer<=0){m.state='wander';m.timer=0}

}

function finishFrame(dt){
  const p=S.p;
  for(const it of S.items)if(!it.got&&Math.hypot(it.x-p.x,it.y-p.y)<12){it.got=true;p.stones++;updHud();noise(.04,3000,.1)}
  for(const k of S.keys)if(!k.got&&p.hop<0&&Math.hypot(k.x-p.x,k.y-p.y)<12){k.got=true;S.got++;updHud();S.streaks.push({x:k.x,y:k.y-8,t:0,i:S.got-1});S.bursts.push({x:k.x,y:k.y-6,t:0});chime(S.got);
    showMsg(S.got<3?`열쇠 ${S.got}/3 · 아직 ${3-S.got}개 남았어요`:'열쇠를 다 모았어요 · 문이 열렸어요')}
  for(let i=S.thrown.length-1;i>=0;i--){const s=S.thrown[i];s.t+=dt/.55;if(s.t>=1){
    if(onPlat(s.x1,s.y1))ripple(s.x1,s.y1,38,'click');else ripple(s.x1,s.y1,145,'stone');S.thrown.splice(i,1)}}
  for(let i=S.drops.length-1;i>=0;i--){const d=S.drops[i];d.x+=d.vx*dt;d.y+=d.vy*dt;d.vz-=160*dt;d.z+=d.vz*dt;if(d.z<0)S.drops.splice(i,1)}
  for(let i=S.rip.length-1;i>=0;i--){const r=S.rip[i];r.r+=dt*(80+r.max*.45);
    for(const m of S.ms){if(r.hb.includes(m))continue;const d=Math.hypot(m.x-r.x,m.y-r.y);if(d<=r.r&&d<=r.max){r.hb.push(m);if(r.max>30)react(m,r.x,r.y,r.kind,true)}}
    if(r.r>r.max)S.rip.splice(i,1)}

  for(let i=S.hear.length-1;i>=0;i--){const h=S.hear[i];h.t-=dt;if(h.t<=0){S.hear.splice(i,1);react(h.m,h.x,h.y,h.kind,false)}}
  S.trust=Math.min(1,S.trust+dt*.012);
  if(S.t>4.5)tip('j',document.body.classList.contains('pc')?'Space로 점프해서 판자를 건너요 · 걸어 나가면 물에 빠져요':'점프 버튼으로 판자를 건너요 · 걸어 나가면 물에 빠져요');
  if(S.t>14&&S.got===0)tip('k','어둠 속에서 가끔 반짝이는 게 열쇠예요');
  for(const m of S.ms)stepMonster(m,dt);
  for(const m of S.ms)if(p.wet&&p.hop<0&&!p.hidden&&Math.hypot(m.x-p.x,m.y-p.y)<12){finish(false);break}
  S.match=Math.max(0,S.match-dt);
  bb.style.setProperty('--b',p.breath.toFixed(3));bb.classList.toggle('held',p.hidden);
  S.doorMsg-=dt;
  if(p.hop<0&&Math.hypot(EXIT.x-p.x,EXIT.y-p.y)<16){if(S.got>=3)finish(true);else if(S.doorMsg<=0){S.doorMsg=3;showMsg(`문이 잠겨 있어요 · 열쇠가 ${3-S.got}개 더 필요해요`);noise(.08,300,.2)}}

  S.cam+=((Math.min(WH-H,Math.max(0,p.y-H*.62)))-S.cam)*Math.min(1,dt*6);
  S.shake=Math.max(0,S.shake-dt);
  document.getElementById('time').textContent=fmt(S.t);
  if(S.t>5&&S.t<5.1)hideMsg();
}

function introStep(dt){S.intro+=dt*(joy?3:1);S.t+=dt;
  const top=camClamp(EXIT.y-H*.45),bot=camClamp(S.p.y-H*.62);S.cam=top+(bot-top)*sstep((S.intro-.7)/1.3);
